# patrones_grupo.yaml — Capa 1 del clasificador de grupo (Motor Q v2 · Fase 1)
#
# Los patrones son REGEX evaluados sobre texto NORMALIZADO (norm() de v2: UPPER, sin
# acentos, espacios colapsados). Cero lógica aquí — patrones.py solo carga y compila.
#
# CRECIMIENTO: únicamente vía el ciclo del audit_motor_clas.md §3 — casos VERIFICADOS
# (confirmado_*/corregido_* en core.clasificacion_log) + golden ampliado en verde ANTES
# de dar por bueno un patrón nuevo. El git log de este archivo es la historia de cómo el
# clasificador aprendió el vocabulario del negocio.
#
# ⚠ Este YAML se carga UNA vez al arranque del backend (como _INDEX del resolver v1):
#   agregar/editar un patrón requiere REINICIAR los backends para que aplique.

version: 1

# Se evalúan ANTES que todo (trampa conocida: "¿cuántos días con reporte hay de X?"
# trae "CUANTOS" pero pregunta por la DISPONIBILIDAD del dato, no por una cifra).
precedencia_maxima:
  jerarquizar:
    # Conteo de jerarquía: "cuántos pozos/campos/gerencias/activos TIENE X". Trae CUANTOS pero pide
    # ESTRUCTURA (nº de sub-entidades), no una cifra. Mismo mecanismo que "días con reporte" (huella):
    # se evalúa ANTES que el 'CUANT[OA]S?\b' de cuantificar → gana el enrutamiento.
    # 🔑 EXIGE EL VERBO ESTRUCTURAL (TIENE/CONFORMAN/…/HAY EN). Sin él, el patrón se tragaba preguntas
    # de OTROS grupos y —al vivir en precedencia_maxima— las sobrescribía TODAS (regresión verificada
    # 2026-08-03): "cuántos campos están por debajo de la meta" y "cuántos campos pesan en el gap" son
    # ANALIZAR; "cuántos pozos produjeron en mayo" e "cuántos campos incumplieron el presupuesto" son
    # CUANTIFICAR. Con el verbo, esas 5 dejan de calzar y conservan su grupo.
    # NO se ancla (fuera de patrones_anclados): sin entidad, "pozos/campos/…" es vocabulario
    # ESTRUCTURAL → pasa por el filtro de dominio y escala a Capa 2 (franja estructural).
    - 'CUANT[OA]S?\s+(CAMPOS?|POZOS?|ACTIVOS?|GERENCIAS?)\s+(TIENE[N]?|CONFORMAN|INTEGRAN|COMPONEN|AGRUPA|HAY\s+EN)'
    # [2026-08-24] Variante con el verbo POSPUESTO: "¿de cuántos campos SE COMPONE el activo X?".
    # El patrón de arriba exige <sustantivo> <verbo> seguidos y esta forma mete el complemento en
    # medio, así que caía a cuantificar por el 'CUANT[OA]S?\b' genérico. Visto en la app: el motor
    # respondía con PRODUCCIÓN (4.368.100 bbl del campo homónimo) en vez del conteo de campos.
    # Cuantificar aquí significa producción, no conteo — por eso esta forma no puede vivir ahí.
    # Incoherencia que corrige: "¿cuántos campos TIENE el activo X?" y "¿de QUÉ campos se compone
    # el activo X?" ya eran jerarquizar; solo esta tercera forma se desviaba.
    # Mantiene la regla del patrón de arriba: EXIGE el verbo estructural, así que no toca
    # "cuántos campos están por debajo de la meta" (analizar) ni "cuántos pozos produjeron" (cuantificar).
    - 'CUANT[OA]S?\s+(CAMPOS?|POZOS?|ACTIVOS?|GERENCIAS?)\s+SE\s+(COMPONE[N]?|CONFORMA[N]?|INTEGRA[N]?)'
    - 'QUE INFORMACION'
    - 'QUE DATOS'
    - 'QUE REPORTES'
    - 'QUE HOJAS'
    - 'DESDE CUANDO'
    - 'HASTA CUANDO'
    - 'CUANTOS DIAS CON REPORTE'
    - 'DIAS CON REPORTE'
    - 'COBERTURA'
    - 'DISPONIBILIDAD'
    - 'DISPONIBLE'
    - 'HUELLA'
    - 'DENSIDAD'
    - 'QUE SE SABE'
  cuantificar:
    # [2026-08-24] Decisión del usuario: "¿QUÉ/CUÁNTOS CAMPOS <situación medible>?" es CUANTIFICAR
    # — la respuesta es la lista de campos con su cifra, información disponible, no análisis causal.
    # Antes ganaba analizar por 'META\b' vía precedencia_colision, y el golden lo fijaba como guarda
    # R1 (2026-08-03). Esa guarda se corrige en el mismo commit: era sobre el VERBO estructural
    # ("cuántos campos TIENE X" = jerarquizar), no sobre el grupo de la forma sin verbo.
    #
    # Va en precedencia_maxima porque debe ganarle a 'META\b'/'GAP\b' de analizar, que en
    # precedencia_colision tiene prioridad. Tres guardas para no pasarse de listo:
    #   1. EXCLUYE el verbo estructural (TIENE/CONFORMAN/…) -> "¿cuántos campos tiene Rubiales?"
    #      sigue siendo jerarquizar (confirmado por el usuario 2026-08-24).
    #   2. EXCLUYE las formas causales PESA[N]/APORTA[N]/EXPLICA[N] -> "¿cuántos campos PESAN más
    #      en el gap?" sigue siendo ANALIZAR (decisión del usuario: ahí gana el gap).
    #   3. EXIGE la situación medible (ESTAN/QUEDARON/INCUMPLIERON/…): sin ella no matchea nada.
    # NO se ancla: 'CAMPOS' es vocabulario estructural (dieta mediterránea, campos de estudio),
    # así que pasa por el filtro de dominio como el resto.
    - '(QUE|CUANT[OA]S?|CUALES?)\s+(CAMPOS?|POZOS?|ACTIVOS?)\s+(?!TIENE|CONFORMAN|INTEGRAN|COMPONEN|AGRUPA|HAY\s+EN|PESA|APORTA|EXPLICA)(ESTAN|QUEDARON|INCUMPLIERON|CUMPLIERON|SUPERARON|BAJARON|SUBIERON|REDUJERON|AUMENTARON)'

grupos:
  jerarquizar:
    - 'PERTENECE[N]?\s+A'
    - 'PERTENECE[N]?\b'
    - 'ESTA[N]?\s+ASOCIAD[OA]S?\s+A'
    - 'QUE\s+ES\s+\w+'
    - 'QUIEN\s+ES\b'
    - 'QUE\s+TIPO\s+DE\s+ENTIDAD'
    - 'CUALES?\s+(CAMPOS?|POZOS?|ACTIVOS?|GERENCIAS?)\s+(TIENE|CONFORMAN|INTEGRAN|COMPONEN)'
    - '(CAMPOS?|POZOS?|ACTIVOS?)\s+(TIENE|CONFORMAN|INTEGRAN|COMPONEN)'
    # [2026-08-24] CUELGAN/DEPENDEN: mismo drill-down que TIENE/CONFORMAN, otro verbo.
    # Medido: "¿qué campos CUELGAN del activo X?" caía a desconocido mientras la misma
    # frase con TIENE resolvía bien. Exige el sustantivo de nivel delante (doble señal),
    # así que no toca "de qué cuelga la caída de producción" ni frases causales.
    - '(CAMPOS?|POZOS?|ACTIVOS?|GERENCIAS?)\s+(CUELGAN|CUELGA|DEPENDEN|DEPENDE)\s+DE'
    # [2026-08-24] DESGLOSAR por NIVEL de la jerarquía (no por producto ni por causa).
    # "desglósame la gerencia PDH POR CAMPO" es estructura; "desglósame la producción POR
    # CAMPO" es cuantificar y "el gap POR CAUSA" es analizar — por eso se exige que lo
    # desglosado sea un nivel Y que el POR también apunte a un nivel. Verificado: las tres
    # frases de riesgo conservan su grupo.
    - 'DESGLOS\w*\s+(LA|EL|LOS|LAS)?\s*(GERENCIA|ACTIVO|VICEPRESIDENCIA|VP|CAMPO)\w*\s+.*\bPOR\s+(CAMPO|ACTIVO|GERENCIA|POZO)'
    - 'DE\s+QUE\s+(ACTIVO|VICEPRESIDENCIA|VP|CAMPO|EMPRESA|GERENCIA|FILIAL)'
    - 'A\s+QUE\s+(ACTIVO|VICEPRESIDENCIA|VP|CAMPO|EMPRESA|GERENCIA|FILIAL)'
    # [2026-08-24] EN QUE <nivel>: la tercera preposición del roll-up. "¿EN QUÉ VP está la
    # gerencia PDH?" es la forma natural de preguntar por la vicepresidencia y no existía —
    # solo DE QUE y A QUE. Va con \s+ESTA para no capturar "¿en qué campos hubo
    # mantenimientos?" (analizar) ni "¿en qué mes produjo más?" (cuantificar), que llevan
    # otro verbo. Se añade VP como abreviatura en las tres, que tampoco estaba.
    - 'EN\s+QUE\s+(ACTIVO|VICEPRESIDENCIA|VP|GERENCIA|FILIAL)\w*\s+(ESTA|SE\s+ENCUENTRA|QUEDA)'
    - 'ESTRUCTURA\s+(DE|DEL|COMPLETA)'
    - 'CONFORMAN'
    - 'SE\s+COMPONE'
    - 'COMPUESTO\s+POR'
    - 'AGRUPA'
    - '\bES\s+(UNA?\s+)?(FILIAL|ACTIVO|CAMPO|POZO|GERENCIA)'
    - 'DONDE\s+ESTA\s+COLGAD[OA]'
    - 'JERARQUIA'
    # [2026-08-24] DESAMBIGUACIÓN conversacional: "cuando digo X, ¿a qué te refieres?".
    # Un nombre como Chichimene existe a la vez como activo y como campo, y esta es la
    # forma natural de pedir que se aclare. La forma explícita ("¿Chichimene es activo o
    # campo?") ya la cubría '\bES (UNA?)?(FILIAL|ACTIVO|CAMPO|...)'; esta no existía.
    # "A QUE TE REFIERES" es de una sola pieza y no aparece en producción ni en causal,
    # así que no necesita doble señal — pero CUANDO DIGO sí la lleva, para no capturar
    # muletillas de otras preguntas.
    - 'A\s+QUE\s+TE\s+REFIERES'
    - 'CUANDO\s+DIGO\s+\w+'
    # RANKING ESTRUCTURAL (2026-08-04). Ordena entidades de la jerarquía por CONTEO (pozos/gerencias/
    # activos/campos) — eje ortogonal al N5 de cuantificar, que rankea por PRODUCCIÓN. Exigen DOBLE
    # señal estructural (sustantivo de nivel + sustantivo de conteo, o "más grandes/pequeños"), así
    # que no matchean producción ni off-topic. Verificado 2026-08-04 contra los 95 casos del golden
    # (clasificacion + cuantificar): 0 secuestros. Van en `grupos` y NO en precedencia_maxima a
    # propósito: así `analizar` conserva precedencia en preguntas causales ("¿por qué los campos con
    # más pozos producen menos?"), que es lo correcto.
    - '(CAMPOS?|ACTIVOS?|GERENCIAS?)\s+(CON|DE)\s+(MAS|MENOS|MAYOR|MENOR)\s+(POZOS?|CAMPOS?|GERENCIAS?|ACTIVOS?)'
    - '(QUE|CUAL(ES)?)\s+(VICEPRESIDENCIA|GERENCIA|ACTIVO|CAMPO)S?\s+TIENE[N]?\s+(MAS|MENOS|MAYOR|MENOR)\s+(GERENCIAS?|ACTIVOS?|CAMPOS?|POZOS?)'
    - '(CAMPOS?|ACTIVOS?|GERENCIAS?)\s+MAS\s+(GRANDES?|PEQUEN[OA]S?|CHIC[OA]S?)'
    - '(CAMPOS?|ACTIVOS?|GERENCIAS?)\s+(CON|DE)\s+(MAYOR|MENOR)\s+(NUMERO|CANTIDAD)\s+DE'
  cuantificar:
    - 'CUANT[OA]S?\b'
    - 'QUE\s+PRODUJO'
    - 'PRODUCCION\s+DE'
    # ── [2026-08-24] VOCABULARIO DE ARRANQUE (lote medido contra el motor, 8 preguntas) ─────
    # Diagnóstico previo: cuantificar dependía de UN SOLO arranque interrogativo ('CUANT[OA]S?\b').
    # Las formas de abajo caían TODAS a desconocido pese a ser las más naturales del negocio.
    # NINGUNA se ancla: sin entidad ni vocabulario deben seguir cayendo fuera (verificado: "¿qué
    # volumen tiene el tanque de mi carro?" y "ayer llovió en Bogotá" siguen en desconocido).
    # `analizar` conserva precedencia en colisión (precedencia_colision), así que "¿por qué bajó
    # la producción?" y "¿qué pasó con la producción ayer?" siguen siendo analizar.
    #
    # MAGNITUD por VOLUMEN: "¿cuál fue el volumen de X?" / "¿qué volumen tuvo X?". VOLUMEN NO se
    # añade a vocabulario_dominio.yaml a propósito (es ambiguo: volumen de agua, de sonido) — la
    # entidad del catálogo es la que confirma el dominio, que es el guardián correcto aquí.
    - '\bVOLUMEN\b'
    # CIERRE: "¿cómo cerró Castilla?" / "¿cómo quedó el mes?". Narrow a CERRO/QUEDO — un 'COMO\s+VA'
    # genérico chocaría con 'COMO VAMOS' de analizar, que es una pregunta de desempeño, no una cifra.
    - 'COMO\s+(CERR[OA]|CERRARON|QUEDO|QUEDARON)\b'
    # IMPERATIVA: "dame el crudo de Rubiales". EXIGE el sustantivo de producción detrás — un
    # (DAME|MUESTRAME) suelto se tragaría "muéstrame la estructura de la gerencia PDH", que es
    # jerarquizar y perdería la colisión (cuantificar le gana a jerarquizar en precedencia).
    - '(DAME|MUESTRAME|MUESTRA|DIME|ENSENAME)\s+(EL|LA|LOS|LAS)?\s*(CRUDO|GAS|BLANCOS|PRODUCCION|VOLUMEN|ACUMULADO|CIFRA|BARRILES?)'
    # TELEGRÁFICA (forma nominal, sin verbo): "Producción Castilla ayer". El patrón anclado de
    # arriba exige 'PRODUCCION DE' y esta forma no lleva la preposición.
    - '\bPRODUCCION\b'
    # FALSO N1: "¿Castilla produjo ayer?" — pregunta por la existencia del dato, pero la respuesta
    # útil es la cifra. 'QUE PRODUJO' (anclado) exigía el QUÉ delante.
    - '\bPRODUJO\b|\bPRODUJERON\b'
    # TELEGRÁFICA (entidad + momento, 2 ranuras vacías): "Castilla ayer". No hay verbo NI sustantivo
    # que atrapar — la única señal es el adverbio de tiempo, y la entidad es lo que lo salva del
    # filtro de dominio. Estas caen en el rechazo honesto de grano día (no_soportado.detectar),
    # que es la respuesta correcta: el dato diario termina 99 días antes de "ayer".
    - '\bAYER\b|\bANTEAYER\b|\bANTIER\b|\bANOCHE\b'
    # SELECTOR TEMPORAL: "¿el mejor día de Castilla este mes?" / "¿qué día produjo más?". Enruta a
    # cuantificar para que llegue al rechazo honesto de `selector_dia` (no_soportado.py) — sin este
    # patrón la pregunta muere en desconocido y el usuario recibe "no entendí" en vez de saber que
    # la capacidad no está construida. NO es el ranking N5: allí se ordenan ENTIDADES por producción;
    # aquí la entidad está fija y lo que se ordena es el TIEMPO (argmax sobre la curva diaria).
    # [2026-08-26 · QV2-DIA-SEL] Alineados con `slots._RX_SELECTOR`, que es quien resuelve la
    # dirección. Antes solo cubrían el singular y (MAS|MENOS): «qué DÍAS fue la producción más
    # baja» no llegaba a cuantificar por aquí, y «qué día fue el de MENOR producción» tampoco.
    # Ventana de 60 (no 24): con la entidad y el mes intercalados el hueco real llega a 49.
    - '(MEJOR|PEOR)(ES)?\s+DIAS?\b'
    - '(QUE|CUAL(ES)?)\s+DIAS?\b.{0,60}?\b(MAS|MENOS|MAYOR|MENOR|ALTA|ALTO|BAJA|BAJO|MAXIM\w*|MINIM\w*)\b'
    - 'DIAS?\s+(DE|CON)\s+(MAYOR|MENOR|MAS|MENOS|ALTA|ALTO|BAJA|BAJO|MAXIM\w*|MINIM\w*)\b'
    - 'ACUMUL(O|A|ADO|ADA)'
    - 'MES\s+A\s+MES'
    - 'COMO\s+VARIO'
    - 'TOTAL\s+DE'
    - 'VALOR\s+DE'
    - 'DIA\s+A\s+DIA'
    - 'ENTRE\s+\w+\s+Y\s+\w+'
    - 'PROMEDIO\s+(DE|DIARIO|MENSUAL)'
    # N5 RANKING (2026-08-04). GENÉRICOS a propósito (NO van a patrones_anclados): así pasan por el
    # filtro de dominio y exigen entidad O vocabulario. Verificado 2026-08-04: las preguntas reales
    # ("…más CRUDO…", "…de GAS…", "…vs PRESUPUESTO") dan nivel_dominio='fuerte' → enrutan DIRECTO sin
    # LLM. Anclarlas repetiría el error del 2026-08-02 ("mejores campos de la dieta mediterránea").
    - 'TOP\s+\d+'
    - 'RANKING\b'
    - '(MAYOR|MENOR|MAS|MENOS)\s+(CANTIDAD|PRODUCCION|VOLUMEN)'
    - '(PRODUCE|PRODUJO|PRODUCEN|PRODUJERON)\s+(MAS|MENOS)\b'
    - '(MAS|MENOS)\s+(CRUDO|GAS|BLANCOS)\b'
    - '(MEJORES|PEORES)\s+(CAMPOS?|ACTIVOS?)'
    - 'MAS\s+(ALTA|BAJA)\s+PRODUCCION'
    - 'QUEDARON\s+(MAS\s+)?CORTOS'
    # [2026-08-04] fix bug real: "¿cuáles campos son los MAYORES PRODUCTORES de crudo?" caía en
    # jerarquizar (ver fix \b de 'ES CAMPO' arriba) y además el vocabulario de N5 no tenía la forma
    # plural MAYORES/MENORES ni "PRODUCTOR(ES)". Genérico a propósito (mismo criterio de arriba):
    # da nivel_dominio='fuerte' por el nombre de producto explícito -> enruta directo sin LLM.
    - '(MAYOR|MENOR)(ES)?\s+PRODUCTOR(ES)?\s+DE\s+(CRUDO|GAS|BLANCOS)'
    # [2026-09-03] DISTRIBUCIÓN/DOMINANCIA CON PRODUCTO EXPLÍCITO. Medido en Pruebas: «¿qué
    # porcentaje del CRUDO aporta el campo Castilla?» caía en desconocido — 8 de 8 formas de
    # pedir el reparto fallaban por decir "crudo"/"gas" en vez de "producción", que es de lo
    # único que colgaba cuantificar. El detector N5 (cuantificar/ranking.py, _DISTRIBUCION) ya
    # sabía atenderlas; nunca le llegaban.
    # GENÉRICO a propósito (NO va a patrones_anclados): las 8 dan nivel_dominio='fuerte' por el
    # nombre del producto -> enrutan directo sin LLM igual. Anclarlo repetiría el error del
    # 2026-08-02 ("mejores campos de la dieta mediterránea"): sin producto, "¿cómo se distribuye
    # la participación en el equipo?" saltaría el filtro. Verificado: esa frase da dominio None.
    # ⚠️ SIN 'PESA|PESAN': 'QUE CAMPOS PESAN' es de ANALIZAR (línea ~206) por decisión del
    # usuario del 2026-08-24, vigilada por 5 casos del golden. Y aunque entrara, analizar gana
    # por precedencia_colision — pero la intención debe ser explícita, no accidental.
    # ⚠️ SIN 'DESGLOS': cuantificar GANA a jerarquizar en precedencia_colision, así que ahí la
    # colisión NO está protegida. Medido 2026-09-03: incluirla ponía roja a
    # test_jerarquia_drill_down_verbos_alternos — "desglósame la gerencia PDH por campo" es
    # drill-down JERÁRQUICO, no una cifra. La palabra ya es de jerarquizar (línea ~93) y del
    # panel de Analizar (respuesta_analizar.py:57). Se queda donde está.
    # ⚠️ LIDERA\w*|LIDERO|LIDERARON y NO 'LIDER\w*': la raíz suelta capturaría LIDERAZGO/LÍDERES,
    # que son organizacionales y no de producción.
    - '(DISTRIBU\w+|REPART\w+|PARTICIPACION|PORCENTA\w+|CONTRIBU\w+|FRACCION|SHARE|PROPORCION|ENCABEZ\w+|LIDERA\w*|LIDERO|LIDERARON|PUNTER\w+)\s'
  analizar:
    - 'POR\s+QUE'
    - 'A\s+QUE\s+SE\s+DEBE'
    - 'COMO\s+VAMOS'
    - 'VAMOS\s+A\s+(LLEGAR|CERRAR|ALCANZAR)'
    - 'QUE\s+CAMPOS?\s+PESA[N]?'
    - 'QUE\s+HACER'
    - 'SE\s+VE\s+RECUPERACION'
    - 'QUE\s+PASO\s+CON'
    - 'DETRACTORES'
    - 'CAUSAS?\s+DE'
    - 'EXPLICA'
    # [2026-08-26] El VERBO explícito. Faltaba: «Analiza el comportamiento de la producción de
    # crudo» la capturaba 'PRODUCCION\s+DE' de cuantificar, que exige una entidad del catálogo,
    # no encontraba ninguna y declinaba — a una pregunta que empieza diciendo «analiza».
    # Analizar SÍ sabe responder sin entidad (análisis global de ECP, RA-2), así que además de
    # ser el destino correcto por semántica, es el único de los dos que puede contestarla.
    - 'ANALIZ[AEO]\w*'
    - 'COMPORTAMIENTO\s+DE\s+LA\s+PRODUCCION'
    - 'PROYECCION'
    - 'TENDENCIA'
    - 'COMPENSAN?'
    - 'GAP\b'
    - 'P50\b'
    - 'META\b'
    - 'DIFERIDAS'
    - 'MANTENIMIENTOS?'
    - 'EBITDA'
    - 'NOPAT'
    # [2026-08-24] Lote Q1 en Test Clas, 3 casos corregidos por el usuario (Control 3). Formas
    # causales coloquiales que la Capa 1 no atrapaba: caían al LLM y este las enrutaba MAL
    # ("¿qué nos pegó en crudo?" -> cuantificar; "¿qué está jalando el crudo para abajo?" ->
    # desconocido). NO se anclan: son verbos del español común ("me pegó la gripa", "jalando
    # la cuerda") y sin dominio dispararían sobre temas ajenos — misma regla que tumbó a
    # 'META\b' y 'COMO VAMOS' de patrones_anclados (ver nota 2026-08-02 abajo). Con el filtro
    # de dominio delante, "¿qué nos pegó en crudo?" pasa por CRUDO y una frase ajena no.
    - 'PEG[OA]\b'
    - 'JALANDO'
    - 'JALA[N]?\s+(PARA\s+)?ABAJO'
    - 'RAZONES?\s+(DE|DEL)'
    - 'MOTIVOS?\s+(DE|DEL)'
    # [2026-09-03 · TENDENCIA] Formas de pedir la LECTURA de la serie que la Capa 1 no atrapaba
    # y caían al LLM (o a cuantificar por 'PRODUCCION\s+DE'). NO se añade 'EVOLUCION' ni
    # 'MES\s+A\s+MES': son de N3 en cuantificar y hoy responden la curva correctamente.
    - 'DECLINACION'
    - 'DECLINA\w*'
    - '(MEDIA|PROMEDIO)\s+MOVIL'
    - 'SUAVIZAD\w*'
    - 'RITMO\s+DE\s+(CAIDA|DECLIN\w*)'
    - 'COMO\s+VIENE'
    - '(VIENE|VA)\s+(SUBIENDO|BAJANDO|CAYENDO)'

# Colisión (2+ grupos atrapan): gana el primero de esta lista. Razón (motor_Q.md §1.1):
# con señales mixtas la pregunta casi siempre quiere el nivel más profundo — "¿cuánto nos
# falta para la meta?" trae CUANTO (cuantificar) y META (analizar) → analizar.
precedencia_colision: [analizar, cuantificar, jerarquizar]

# --- Filtro de dominio (motor_Q.md §1.2, Decisión D2) --------------------------------------
# Patrones ANCLADOS: señal inequívoca de dominio → se saltan el filtro (enrutan directo aunque
# no haya entidad ni palabra de vocabulario). El RESTO son "genéricos" y SÍ pasan por el filtro.
# Las cadenas calzan EXACTO con las de grupos/precedencia_maxima. Crece por el ciclo verificado.
#
# [2026-08-02] Retirados de esta lista (pasan a genéricos): 'META\b', 'DETRACTORES',
#   'QUE CAMPOS? PESA[N]?', 'CUANTOS DIAS CON REPORTE'. Verificado en vivo (lote de prueba en
#   Test Clas, calificado por el usuario/Control 3): las 4 disparaban sobre temas AJENOS a
#   producción por coincidencia sintáctica pura ("meta de ahorro", "detractores del rendimiento
#   académico", "campos pesan en la dieta mediterránea", "días con reporte sobre el clima").
#   Regla del usuario: "Meta debería estar acompañado del término producción para que fuera de
#   Análisis" — generaliza a las 4: la palabra sola NO basta, necesita entidad o vocabulario.
#   Único caso del golden afectado: "¿Cuánto nos falta para la meta?" (sin entidad ni
#   vocabulario) pasa de analizar a desconocido — decisión explícita, no regresión accidental.
#
# [2026-08-02 · 2ª tanda] Retirada 'COMO VAMOS' (trampa verificada: "¿cómo vamos con la meta de
#   pasos diarios?" saltaba el filtro por la ancla y clasificaba analizar). Ahora pasa por el
#   filtro: sin entidad ni vocabulario → OUT. "¿Cómo vamos contra el P50?" NO se rompe porque
#   'P50\b' sigue anclado (protege ese caso). 'VAMOS A LLEGAR' se conserva anclado: el golden
#   "¿vamos a llegar a la meta este mes?" no trae vocabulario y depende de esa ancla.
patrones_anclados:
  # de precedencia_maxima (disponibilidad del dato — dominio puro):
  - 'DIAS CON REPORTE'
  - 'COBERTURA'
  - 'DISPONIBILIDAD'
  - 'DISPONIBLE'
  - 'HUELLA'
  - 'DENSIDAD'
  # de jerarquizar (nombran niveles del catálogo):
  - 'CUALES?\s+(CAMPOS?|POZOS?|ACTIVOS?|GERENCIAS?)\s+(TIENE|CONFORMAN|INTEGRAN|COMPONEN)'
  - '(CAMPOS?|POZOS?|ACTIVOS?)\s+(TIENE|CONFORMAN|INTEGRAN|COMPONEN)'
  # [2026-08-24] VP añadido en las dos, en sincronía con `grupos.jerarquizar`. Estas cadenas
  # se comparan LITERALMENTE contra las de arriba (lo verifica test_anclados_existen_en_patrones),
  # así que cualquier cambio allí debe repetirse aquí o el patrón deja de estar anclado.
  - 'DE\s+QUE\s+(ACTIVO|VICEPRESIDENCIA|VP|CAMPO|EMPRESA|GERENCIA|FILIAL)'
  - 'A\s+QUE\s+(ACTIVO|VICEPRESIDENCIA|VP|CAMPO|EMPRESA|GERENCIA|FILIAL)'
  - 'EN\s+QUE\s+(ACTIVO|VICEPRESIDENCIA|VP|GERENCIA|FILIAL)\w*\s+(ESTA|SE\s+ENCUENTRA|QUEDA)'
  - '(CAMPOS?|POZOS?|ACTIVOS?|GERENCIAS?)\s+(CUELGAN|CUELGA|DEPENDEN|DEPENDE)\s+DE'
  - '\bES\s+(UNA?\s+)?(FILIAL|ACTIVO|CAMPO|POZO|GERENCIA)'
  - 'DONDE\s+ESTA\s+COLGAD[OA]'
  - 'JERARQUIA'
  # de cuantificar (producción explícita):
  - 'QUE\s+PRODUJO'
  - 'PRODUCCION\s+DE'
  # de analizar (métricas/objetos del negocio):
  - 'GAP\b'
  - 'P50\b'
  - 'DIFERIDAS'
  - 'MANTENIMIENTOS?'
  - 'EBITDA'
  - 'NOPAT'
  # 'COMO VAMOS' retirada [2026-08-02 · 2ª tanda]: era demasiado amplia (bypass con cualquier
  # tema). Sigue siendo patrón genérico de analizar; ahora pasa por el filtro. "cómo vamos contra
  # el P50" queda protegido por la ancla 'P50\b'. Ver nota arriba.
  - 'VAMOS\s+A\s+(LLEGAR|CERRAR|ALCANZAR)'
  # Ranking estructural (2026-08-04): doble señal estructural = dominio autoconfirmado. ANCLAJE
  # OBLIGATORIO: sin él, "¿qué vicepresidencia tiene más gerencias?" cae en desconocido/OUT
  # (nivel_dominio devuelve None para ese texto — medido 2026-08-04), no solo "escala al LLM".
  - '(CAMPOS?|ACTIVOS?|GERENCIAS?)\s+(CON|DE)\s+(MAS|MENOS|MAYOR|MENOR)\s+(POZOS?|CAMPOS?|GERENCIAS?|ACTIVOS?)'
  - '(QUE|CUAL(ES)?)\s+(VICEPRESIDENCIA|GERENCIA|ACTIVO|CAMPO)S?\s+TIENE[N]?\s+(MAS|MENOS|MAYOR|MENOR)\s+(GERENCIAS?|ACTIVOS?|CAMPOS?|POZOS?)'
  - '(CAMPOS?|ACTIVOS?|GERENCIAS?)\s+MAS\s+(GRANDES?|PEQUEN[OA]S?|CHIC[OA]S?)'
  - '(CAMPOS?|ACTIVOS?|GERENCIAS?)\s+(CON|DE)\s+(MAYOR|MENOR)\s+(NUMERO|CANTIDAD)\s+DE'
